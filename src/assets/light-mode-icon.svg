  <use href="#sun-ray" class="sun-ray sun-ray-top"/>
  <use href="#sun-ray" class="sun-ray sun-ray-top-right" transform="rotate(45 12 12)"/>
  <use href="#sun-ray" class="sun-ray sun-ray-right" transform="rotate(90 12 12)"/>
  <use href="#sun-ray" class="sun-ray sun-ray-bottom-right" transform="rotate(135 12 12)"/>
  <use href="#sun-ray" class="sun-ray sun-ray-bottom" transform="rotate(180 12 12)"/>
  <use href="#sun-ray" class="sun-ray sun-ray-bottom-left" transform="rotate(225 12 12)"/>
  <use href="#sun-ray" class="sun-ray sun-ray-left" transform="rotate(270 12 12)"/>
